# -----------------------------------------------------
# Key bindings
# -----------------------------------------------------

$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/scripts
$TERMINAL = kitty
$FILEMANAGER = dolphin
$BROWSER = zen

# noctalia shell
$ipc = qs -c noctalia-shell ipc call

# bind = $mainMod, D, exec, $ipc launcher toggle
# bind = $mainMod, Q, exec, $ipc sessionMenu toggle
# bind = $mainMod, V, exec, $ipc launcher clipboard
# bind = $mainMod, R, exec, $ipc launcher command
# bind = $mainMod, L, exec, $ipc lockScreen lock

# Applications
bind = $mainMod, RETURN, exec, $TERMINAL # Открыть терминал
bind = $mainMod, B, exec, $BROWSER # Открыть браузер
bind = $mainMod, E, exec, $FILEMANAGER # Открыть файловый менеджер
bind = $mainMod, Z, togglespecialworkspace, special # Открыть Специальное рабочее пространство
bind = $mainMod, M, exec, $HYPRSCRIPTS/start_ncmpcpp.sh # Открыть ncmpcpp
bind = $mainMod, Y, exec, $HYPRSCRIPTS/start_yazi.sh # Открыть yazi
bind = $mainMod SHIFT, Y, exec, $HYPRSCRIPTS/start_yamusic.sh # Открыть Яндекс музыку

# Windows
bind = $mainMod, C, killactive # Закрыть активное окно
bind = $mainMod, F, fullscreen # Развернуть активное окно на полный экран
bind = $mainMod, T, togglefloating # Переключить активное окно в плавающий режим
bind = $mainMod SHIFT, T, exec, $HYPRSCRIPTS/toggleallfloat.sh # Переключить все окна в плавающий режим
bind = $mainMod, J, layoutmsg, togglesplit # Переключить сплит
bind = $mainMod, left, movefocus, l # Переместить фокус влево
bind = $mainMod, right, movefocus, r # Переместить фокус вправо
bind = $mainMod, up, movefocus, u # Переместить фокус вверх
bind = $mainMod, down, movefocus, d # Переместить фокус вниз
bindm = $mainMod, mouse:272, movewindow # Переместить окно мышью
bindm = $mainMod, mouse:273, resizewindow # Изменить размеры окна мышью
bind = $mainMod SHIFT, right, resizeactive, 50 0 # Увеличить ширину окна
bind = $mainMod SHIFT, left, resizeactive, -50 0 # Уменьшить ширину окна
bind = $mainMod SHIFT, down, resizeactive, 0 50 # Увеличить высоту окна
bind = $mainMod SHIFT, up, resizeactive, 0 -50 # Уменьшить высоту окна
bind = $mainMod, G, togglegroup # Переключить группу окон

# Actions
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh # Сделать снимок экрана
bind = $mainMod SHIFT, PRINT, exec, $HYPRSCRIPTS/rec_region.sh # Сделать запись видео экрана
bind = $mainMod CTRL, Q, exec, wlogout # Запустить wlogout
bind = $mainMod CTRL, W, exec, waypaper # Открыть выбор фонового изображения
bind = $mainMod, D, exec, rofi -show drun -replace -i # Открыть запуск приложений
bind = $mainMod CTRL, H, exec, $HYPRSCRIPTS/keybindings.sh # Показать привязки клавиш
bind = $mainMod SHIFT, B, exec, hyprpanel -q && hyprpanel # Перезагрузить hyprpanel
bind = $mainMod CTRL, B, exec, hyprpanel -t bar-0 # Скрыть hyprpanel
bind = $mainMod, V, exec, $HYPRSCRIPTS/cliphist.sh # Открыть менеджер буфера обмена
#bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/hyprshade.sh # Переключить шейдер
#bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh # Toggle game mode
bind = $mainMod, L, exec, hyprlock # Заблокировать экран
bind = $mainMod, R, exec, hyprpanel r # Перезапустить hyprpanel

# Workspaces
bind = $mainMod, 1, workspace, 1 # Workspace 1
bind = $mainMod, 2, workspace, 2 # Workspace 2
bind = $mainMod, 3, workspace, 3 # Workspace 3
bind = $mainMod, 4, workspace, 4 # Workspace 4
bind = $mainMod, 5, workspace, 5 # Workspace 5
bind = $mainMod, 6, workspace, 6 # Workspace 6
bind = $mainMod, 7, workspace, 7 # Workspace 7
bind = $mainMod, 8, workspace, 8 # Workspace 8
bind = $mainMod, 9, workspace, 9 # Workspace 9
bind = $mainMod, 0, workspace, 10 # Workspace 10

#bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move active window to workspace 1
#bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move active window to workspace 2
#bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move active window to workspace 3
#bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move active window to workspace 4
#bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move active window to workspace 5
#bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move active window to workspace 6
#bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move active window to workspace 7
#bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move active window to workspace 8
#bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move active window to workspace 9
#bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move active window to workspace 10

bind = $mainMod SHIFT, Z, movetoworkspace, special # Переместить активное окно на специальное рабочее пространство

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1 # Переместить активное окно на рабочее пространство 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2 # Переместить активное окно на рабочее пространство 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3 # Переместить активное окно на рабочее пространство 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4 # Переместить активное окно на рабочее пространство 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5 # Переместить активное окно на рабочее пространство 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6 # Переместить активное окно на рабочее пространство 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7 # Переместить активное окно на рабочее пространство 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8 # Переместить активное окно на рабочее пространство 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9 # Переместить активное окно на рабочее пространство 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10 # Переместить активное окно на рабочее пространство 10

bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1 # Переместить все окна на рабочее пространство 1
bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2 # Переместить все окна на рабочее пространство 2
bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3 # Переместить все окна на рабочее пространство 3
bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4 # Переместить все окна на рабочее пространство 4
bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5 # Переместить все окна на рабочее пространство 5
bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6 # Переместить все окна на рабочее пространство 6
bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7 # Переместить все окна на рабочее пространство 7
bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8 # Переместить все окна на рабочее пространство 8
bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9 # Переместить все окна на рабочее пространство 9
bind = $mainMod CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10 # Переместить все окна на рабочее пространство 10

bind = $mainMod, mouse_down, workspace, e+1 # Перейти на следующее рабочее пространство
bind = $mainMod, mouse_up, workspace, e-1 # Перейти на Предыдущее рабочее пространство
bind = $mainMod CTRL, down, workspace, empty # Перейти на следующее пустое рабочее пространство

# Passthrough SUPER KEY to Virtual Machine
# bind = $mainMod, P, submap, passthru # Passthrough SUPER key to virtual machine
# submap = passthru
# bind = SUPER, Escape, submap, reset # Get SUPER key back from virtual machine
# submap = reset

bind = $mainMod SHIFT, up, exec, brightnessctl -q s +10%- # Увеличить яркость 10%
bind = $mainMod SHIFT, down, exec, brightnessctl -q s 10%- # Уменьшить яркость на 10%

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Увеличить яркость на 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Уменьшить яркость на 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% # Громче на 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% # Тише на 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Мьют
bind = , XF86AudioPlay, exec, playerctl play-pause # Запуск/пауза
bind = , XF86AudioPause, exec, playerctl pause # Пауза
bind = , XF86AudioNext, exec, playerctl next # Следующее аудио
bind = , XF86AudioPrev, exec, playerctl previous # Предыдущее аудио
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Вкл./выкл. микрофон
bind = , XF86Calculator, exec, qalculate-gtk # Открыть калькулятор
bind = , XF86Lock, exec, hyprlock # Заблокировать экран
