# Matugen generated colors for Kitty
# Include this file in your main kitty.conf with: include ~/.config/kitty/themes/Matugen.conf

# The basic 16 terminal colors
color0  @{background.dark.hex}
color1  @{error.dark.hex}
color2  @{success.dark.hex}
color3  @{warning.dark.hex}
color4  @{primary.dark.hex}
color5  @{tertiary.dark.hex}
color6  @{secondary.dark.hex}
color7  @{on_background.dark.hex}

color8  @{background.light.hex} # Bright black (often a lighter background variant)
color9  @{error.light.hex}
color10 @{success.light.hex}
color11 @{warning.light.hex}
color12 @{primary.light.hex}
color13 @{tertiary.light.hex}
color14 @{secondary.light.hex}
color15 @{on_background.light.hex} # Bright white (often on background variant)

# Foreground and background colors
foreground @{on_background.dark.hex}
background @{background.dark.hex}
cursor     @{cursor.dark.hex}

# Selection colors
selection_foreground @{on_primary.dark.hex}
selection_background @{primary.dark.hex}

# URL colors
url_color @{secondary.dark.hex}

# You can access different color formats (hex, rgb, etc.)
# Example: background @{background.rgb}